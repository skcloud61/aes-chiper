<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AES Cipher">
    <title>AES Cipher</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --secondary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f5f3ff;
            --card: #ffffff;
            --text: #1e1b4b;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(124,58,237,0.10);
            --radius: 18px;
            --radius-sm: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Apple SD Gothic Neo',
                         'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--secondary) 100%);
            padding: 52px 20px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .header-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .header-badge {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .tab-bar {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(124,58,237,0.04);
        }
        .tab-content {
            display: none;
            padding: 20px 16px;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content.active { display: block; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(124,58,237,0.08);
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title .badge {
            font-size: 10px;
            font-weight: 700;
            background: rgba(124,58,237,0.1);
            color: var(--primary);
            border-radius: 6px;
            padding: 2px 7px;
            letter-spacing: 0.5px;
        }
        .input-group { margin-bottom: 14px; }
        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            background: #fafafa;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .input-field:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(124,58,237,0.08);
        }
        .input-field.key-field {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            color: var(--primary);
        }
        /* 비밀번호 토글 wrapper */
        .pw-wrapper {
            position: relative;
        }
        .pw-wrapper .input-field {
            padding-right: 48px;
        }
        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-sub);
            padding: 4px;
            line-height: 1;
        }
        textarea.input-field {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }
        .char-count {
            text-align: right;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.35);
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, #0ea5e9 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(79,70,229,0.35);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #0d9488 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(16,185,129,0.3);
        }
        .btn-small {
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 8px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-sub);
            box-shadow: none;
        }
        .btn-outline:active { background: var(--bg); }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            border: 2px solid rgba(16,185,129,0.3);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 12px;
        }
        .result-box.decrypt-result {
            background: linear-gradient(135deg, #eff6ff, #f0f9ff);
            border-color: rgba(79,70,229,0.3);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--success);
        }
        .result-label.decrypt { color: var(--secondary); }
        .result-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.6;
            background: rgba(255,255,255,0.7);
            padding: 10px 12px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .result-text.plain-text {
            font-family: inherit;
            font-size: 16px;
        }
        /* 키 강도 */
        .key-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .strength-bar {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.3s;
        }
        /* 정보 박스 */
        .info-box {
            background: rgba(124,58,237,0.05);
            border: 1px solid rgba(124,58,237,0.15);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
            line-height: 1.7;
        }
        .info-box strong { color: var(--primary); }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { background: var(--success); }
        .toast.error   { background: var(--danger); }
        .toast.info    { background: var(--primary); }
        .error-msg {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 13px;
            color: var(--danger);
            margin-top: 10px;
            display: none;
        }
        .error-msg.show { display: flex; align-items: center; gap: 8px; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .result-animate {
            animation: fadeInUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<!-- ───────── 헤더 ───────── -->
<div class="app-header">
    <div class="header-title"> AES Cipher</div>
    <div class="header-sub">Advanced · Encryption · Standard</div>
    <div class="header-badge">AES-256-GCM</div>
</div>

<!-- ───────── 탭 바 ───────── -->
<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('encrypt')" id="tab-encrypt"> 암호화</button>
    <button class="tab-btn" onclick="switchTab('decrypt')" id="tab-decrypt"> 복호화</button>
</div>

<!-- ───────── 암호화 탭 ───────── -->
<div class="tab-content active" id="content-encrypt">

    <div class="card">
        <div class="card-title">
             암호화 키
            <span class="badge">AES-256</span>
        </div>
        <div class="input-group">
            <label class="input-label">비밀번호 (복호화 시 동일한 키 필요)</label>
            <div class="pw-wrapper">
                <input
                    type="password"
                    id="enc-key"
                    class="input-field key-field"
                    placeholder="비밀번호를 입력하세요"
                    oninput="onKeyInput(this, 'enc')"
                    autocomplete="new-password"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
                <button class="pw-toggle" onclick="togglePw('enc-key', this)" type="button">👁️</button>
            </div>
            <div class="key-strength">
                <div class="strength-bar" id="sb1"></div>
                <div class="strength-bar" id="sb2"></div>
                <div class="strength-bar" id="sb3"></div>
                <div class="strength-bar" id="sb4"></div>
                <div class="strength-bar" id="sb5"></div>
            </div>
            <div style="font-size:11px; color:var(--text-sub); margin-top:5px;" id="strength-label">
                키를 입력하면 강도가 표시됩니다
            </div>
        </div>
        <div class="info-box">
            <strong>AES-256-GCM</strong> 방식으로 암호화됩니다.<br>
            키는 <strong>PBKDF2</strong>(100,000회 반복)로 안전하게 변환되며,<br>
            매번 <strong>랜덤 Salt + IV</strong>가 생성되어 결과가 달라집니다.
        </div>
    </div>

    <div class="card">
        <div class="card-title">📝 평문 입력</div>
        <div class="input-group">
            <label class="input-label">한글 / 영어 / 숫자 / 특수문자 모두 지원</label>
            <textarea
                id="enc-input"
                class="input-field"
                placeholder="암호화할 텍스트를 입력하세요..."
                oninput="updateCharCount('enc-input', 'enc-count')"
            ></textarea>
            <div class="char-count" id="enc-count">0자</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-outline btn-small" onclick="clearEncrypt()">지우기</button>
            <button class="btn btn-outline btn-small" onclick="pasteFromClipboard('enc-input')">붙여넣기</button>
        </div>
    </div>

    <div class="error-msg" id="enc-error">
        <span></span><span id="enc-error-text"></span>
    </div>

    <button class="btn btn-primary" id="enc-btn" onclick="doEncrypt()">
         암호화하기
    </button>

    <div id="enc-result-wrap" style="display:none;">
        <div class="result-box result-animate">
            <div class="result-header">
                <div class="result-label">  암호화 완료</div>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-success btn-small" onclick="copyText('enc-output')">복사</button>
                    <button class="btn btn-outline btn-small" onclick="shareText()">공유</button>
                </div>
            </div>
            <div class="result-text" id="enc-output"></div>
        </div>
    </div>

</div>

<!-- ───────── 복호화 탭 ───────── -->
<div class="tab-content" id="content-decrypt">

    <div class="card">
        <div class="card-title">
             복호화 키
            <span class="badge">AES-256</span>
        </div>
        <div class="input-group">
            <label class="input-label">암호화 시 사용한 비밀번호와 동일해야 합니다</label>
            <div class="pw-wrapper">
                <input
                    type="password"
                    id="dec-key"
                    class="input-field key-field"
                    placeholder="비밀번호를 입력하세요"
                    oninput="onKeyInput(this, 'dec')"
                    autocomplete="current-password"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
                <button class="pw-toggle" onclick="togglePw('dec-key', this)" type="button">👁️</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title"> 암호문 입력</div>
        <div class="input-group">
            <label class="input-label">복호화할 AES 암호문</label>
            <textarea
                id="dec-input"
                class="input-field"
                placeholder="AES 암호화된 텍스트를 붙여넣으세요..."
                oninput="updateCharCount('dec-input', 'dec-count')"
                style="font-family: 'SF Mono', monospace; font-size:13px;"
            ></textarea>
            <div class="char-count" id="dec-count">0자</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-outline btn-small" onclick="clearDecrypt()">지우기</button>
            <button class="btn btn-outline btn-small" onclick="pasteFromClipboard('dec-input')">붙여넣기</button>
            <button class="btn btn-outline btn-small" onclick="loadFromEncrypt()">가져오기</button>
        </div>
    </div>

    <div class="error-msg" id="dec-error">
        <span></span><span id="dec-error-text"></span>
    </div>

    <button class="btn btn-secondary" id="dec-btn" onclick="doDecrypt()">
         복호화하기
    </button>

    <div id="dec-result-wrap" style="display:none;">
        <div class="result-box decrypt-result result-animate">
            <div class="result-header">
                <div class="result-label decrypt">  복호화 완료</div>
                <button class="btn btn-secondary btn-small" onclick="copyText('dec-output')">복사</button>
            </div>
            <div class="result-text plain-text" id="dec-output"></div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════
   AES-256-GCM  ·  Web Crypto API
   키 파생: PBKDF2 (SHA-256, 100000 iterations)
   포맷: Base64( salt[16] | iv[12] | ciphertext )
════════════════════════════════════════════ */
const AESCipher = {

    /* 문자열 키 → CryptoKey (PBKDF2 → AES-GCM) */
    async deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            'raw',
            enc.encode(password),
            { name: 'PBKDF2' },
            false,
            ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            {
                name: 'PBKDF2',
                salt: salt,
                iterations: 100000,
                hash: 'SHA-256'
            },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    },

    /* 암호화 → Base64 문자열 반환 */
    async encrypt(plainText, password) {
        const enc     = new TextEncoder();
        const salt    = crypto.getRandomValues(new Uint8Array(16));
        const iv      = crypto.getRandomValues(new Uint8Array(12));
        const key     = await this.deriveKey(password, salt);
        const cipher  = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            enc.encode(plainText)
        );
        /* salt(16) + iv(12) + ciphertext 를 합쳐 Base64로 */
        const combined = new Uint8Array(salt.length + iv.length + cipher.byteLength);
        combined.set(salt,     0);
        combined.set(iv,       salt.length);
        combined.set(new Uint8Array(cipher), salt.length + iv.length);
        return btoa(String.fromCharCode(...combined));
    },

    /* Base64 문자열 → 복호화 */
    async decrypt(b64Text, password) {
        const raw      = Uint8Array.from(atob(b64Text), c => c.charCodeAt(0));
        const salt     = raw.slice(0, 16);
        const iv       = raw.slice(16, 28);
        const data     = raw.slice(28);
        const key      = await this.deriveKey(password, salt);
        const plain    = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv },
            key,
            data
        );
        return new TextDecoder().decode(plain);
    }
};

/* ════════════════════════════════════════════
   UI 헬퍼
════════════════════════════════════════════ */
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('content-' + name).classList.add('active');
}

function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🙈';
    } else {
        inp.type = 'password';
        btn.textContent = '👁️';
    }
}

function onKeyInput(el, prefix) {
    if (prefix === 'enc') updateKeyStrength(el.value);
}

function updateCharCount(inputId, countId) {
    const len = [...document.getElementById(inputId).value].length;
    document.getElementById(countId).textContent = len.toLocaleString() + '자';
}

/* ════════════════════════════════════════════
   암호화
════════════════════════════════════════════ */
async function doEncrypt() {
    const text = document.getElementById('enc-input').value;
    const key  = document.getElementById('enc-key').value;
    hideError('enc');

    if (!text.trim()) { showError('enc', '암호화할 텍스트를 입력해주세요.'); return; }
    if (!key)         { showError('enc', '비밀번호(키)를 입력해주세요.');    return; }

    const btn = document.getElementById('enc-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> AES 암호화 중...';

    try {
        const result = await AESCipher.encrypt(text, key);
        document.getElementById('enc-output').textContent = result;
        const wrap = document.getElementById('enc-result-wrap');
        wrap.style.display = 'block';
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        showToast('AES 암호화 완료 ', 'success');
    } catch(e) {
        showError('enc', '암호화 오류: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = ' 암호화하기';
    }
}

/* ════════════════════════════════════════════
   복호화
════════════════════════════════════════════ */
async function doDecrypt() {
    const cipher = document.getElementById('dec-input').value.trim();
    const key    = document.getElementById('dec-key').value;
    hideError('dec');

    if (!cipher) { showError('dec', '복호화할 암호문을 입력해주세요.'); return; }
    if (!key)    { showError('dec', '비밀번호(키)를 입력해주세요.');    return; }

    const btn = document.getElementById('dec-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> AES 복호화 중...';

    try {
        const result = await AESCipher.decrypt(cipher, key);
        document.getElementById('dec-output').textContent = result;
        const wrap = document.getElementById('dec-result-wrap');
        wrap.style.display = 'block';
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        showToast('AES 복호화 완료 ', 'success');
    } catch(e) {
        showError('dec', '복호화 실패: 키가 틀렸거나 잘못된 암호문입니다.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = ' 복호화하기';
    }
}

/* ════════════════════════════════════════════
   클립보드 / 공유 / 가져오기
════════════════════════════════════════════ */
async function copyText(elementId) {
    const text = document.getElementById(elementId).textContent;
    try {
        await navigator.clipboard.writeText(text);
        showToast('클립보드에 복사됨', 'info');
    } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('복사됨', 'info');
    }
}

async function shareText() {
    const text = document.getElementById('enc-output').textContent;
    if (navigator.share) {
        try { await navigator.share({ title: 'AES 암호문', text }); }
        catch(e) {}
    } else {
        copyText('enc-output');
    }
}

async function pasteFromClipboard(inputId) {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById(inputId).value = text;
        const countId = inputId === 'enc-input' ? 'enc-count' : 'dec-count';
        updateCharCount(inputId, countId);
        showToast('붙여넣기 완료', 'info');
    } catch {
        showToast('직접 붙여넣기 해주세요 (길게 탭)', 'error');
    }
}

function loadFromEncrypt() {
    const encrypted = document.getElementById('enc-output').textContent;
    const key = document.getElementById('enc-key').value;
    if (encrypted) {
        document.getElementById('dec-input').value = encrypted;
        document.getElementById('dec-key').value = key;
        updateCharCount('dec-input', 'dec-count');
        showToast('가져오기 완료', 'info');
    } else {
        showToast('먼저 암호화를 실행하세요', 'error');
    }
}

function clearEncrypt() {
    document.getElementById('enc-input').value = '';
    document.getElementById('enc-key').value = '';
    document.getElementById('enc-count').textContent = '0자';
    document.getElementById('enc-result-wrap').style.display = 'none';
    document.getElementById('enc-output').textContent = '';
    hideError('enc');
    resetKeyStrength();
}

function clearDecrypt() {
    document.getElementById('dec-input').value = '';
    document.getElementById('dec-key').value = '';
    document.getElementById('dec-count').textContent = '0자';
    document.getElementById('dec-result-wrap').style.display = 'none';
    document.getElementById('dec-output').textContent = '';
    hideError('dec');
}

/* ════════════════════════════════════════════
   에러 / 토스트 / 키 강도
════════════════════════════════════════════ */
function showError(prefix, msg) {
    const el = document.getElementById(prefix + '-error');
    document.getElementById(prefix + '-error-text').textContent = msg;
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hideError(prefix) {
    document.getElementById(prefix + '-error').classList.remove('show');
}

function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateKeyStrength(value) {
    const len = value.length;
    const hasUpper  = /[A-Z]/.test(value);
    const hasLower  = /[a-z]/.test(value);
    const hasNum    = /[0-9]/.test(value);
    const hasSymbol = /[^A-Za-z0-9]/.test(value);
    const variety   = [hasUpper, hasLower, hasNum, hasSymbol].filter(Boolean).length;

    let strength = 0;
    if (len >= 1)  strength = 1;
    if (len >= 6)  strength = 2;
    if (len >= 8 && variety >= 2) strength = 3;
    if (len >= 10 && variety >= 3) strength = 4;
    if (len >= 12 && variety >= 4) strength = 5;

    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#10b981'];
    const labels = ['매우 약함','약함','보통','강함','매우 강함'];

    ['sb1','sb2','sb3','sb4','sb5'].forEach((id, i) => {
        document.getElementById(id).style.background =
            i < strength ? colors[strength - 1] : 'var(--border)';
    });
    const label = document.getElementById('strength-label');
    if (len === 0) {
        label.textContent = '키를 입력하면 강도가 표시됩니다';
        label.style.color = 'var(--text-sub)';
    } else {
        label.textContent = '키 강도: ' + labels[strength - 1];
        label.style.color = colors[strength - 1];
    }
}

function resetKeyStrength() {
    ['sb1','sb2','sb3','sb4','sb5'].forEach(id => {
        document.getElementById(id).style.background = 'var(--border)';
    });
    const label = document.getElementById('strength-label');
    label.textContent = '키를 입력하면 강도가 표시됩니다';
    label.style.color = 'var(--text-sub)';
}

/* ════════════════════════════════════════════
   키보드 단축키
════════════════════════════════════════════ */
document.getElementById('enc-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doEncrypt();
});
document.getElementById('dec-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doDecrypt();
});

document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('focus', () => {
        setTimeout(() => {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 350);
    });
});
</script>
