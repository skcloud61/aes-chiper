<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RES Cipher">
    <title>RES Cipher</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --secondary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f5f3ff;
            --card: #ffffff;
            --text: #1e1b4b;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(124,58,237,0.10);
            --radius: 18px;
            --radius-sm: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'Apple SD Gothic Neo',
                         'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--secondary) 100%);
            padding: 52px 20px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 160px; height: 160px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .header-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .tab-bar {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(124,58,237,0.04);
        }
        .tab-content {
            display: none;
            padding: 20px 16px;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content.active { display: block; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(124,58,237,0.08);
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .input-group { margin-bottom: 14px; }
        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
        }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            background: #fafafa;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .input-field:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(124,58,237,0.08);
        }
        .input-field.key-field {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            text-align: center;
            color: var(--primary);
        }
        textarea.input-field {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }
        .char-count {
            text-align: right;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.35);
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, #0ea5e9 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(79,70,229,0.35);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #0d9488 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(16,185,129,0.3);
        }
        .btn-small {
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 8px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-sub);
            box-shadow: none;
        }
        .btn-outline:active { background: var(--bg); }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            border: 2px solid rgba(16,185,129,0.3);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 12px;
        }
        .result-box.decrypt-result {
            background: linear-gradient(135deg, #eff6ff, #f0f9ff);
            border-color: rgba(79,70,229,0.3);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--success);
        }
        .result-label.decrypt { color: var(--secondary); }
        .result-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.6;
            background: rgba(255,255,255,0.7);
            padding: 10px 12px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .result-text.plain-text {
            font-family: inherit;
            font-size: 16px;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { background: var(--success); }
        .toast.error   { background: var(--danger); }
        .toast.info    { background: var(--primary); }
        .error-msg {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 13px;
            color: var(--danger);
            margin-top: 10px;
            display: none;
        }
        .error-msg.show { display: flex; align-items: center; gap: 8px; }
        .key-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .strength-bar {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.3s;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .result-animate {
            animation: fadeInUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-title">RES Cipher</div>
    <div class="header-sub">Row · Expansion · Substitution</div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('encrypt')" id="tab-encrypt">암호화</button>
    <button class="tab-btn" onclick="switchTab('decrypt')" id="tab-decrypt">복호화</button>
</div>

<!-- 암호화 탭 -->
<div class="tab-content active" id="content-encrypt">
    <div class="card">
        <div class="card-title">암호화 키</div>
        <div class="input-group">
            <label class="input-label">숫자 키 (복호화 시 동일한 키 필요)</label>
            <input
                type="text"
                id="enc-key"
                class="input-field key-field"
                placeholder="예: 1234"
                inputmode="numeric"
                pattern="[0-9]*"
                oninput="onKeyInput(this, 'enc')"
                maxlength="10"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >
            <div class="key-strength">
                <div class="strength-bar" id="sb1"></div>
                <div class="strength-bar" id="sb2"></div>
                <div class="strength-bar" id="sb3"></div>
                <div class="strength-bar" id="sb4"></div>
                <div class="strength-bar" id="sb5"></div>
            </div>
            <div style="font-size:11px; color:var(--text-sub); margin-top:5px;" id="strength-label">
                키를 입력하면 강도가 표시됩니다
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">평문 입력</div>
        <div class="input-group">
            <label class="input-label">한글 / 영어 / 숫자 모두 지원</label>
            <textarea
                id="enc-input"
                class="input-field"
                placeholder="암호화할 텍스트를 입력하세요..."
                oninput="updateCharCount('enc-input', 'enc-count')"
            ></textarea>
            <div class="char-count" id="enc-count">0자</div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-outline btn-small" onclick="clearEncrypt()">지우기</button>
            <button class="btn btn-outline btn-small" onclick="pasteFromClipboard('enc-input')">붙여넣기</button>
        </div>
    </div>

    <div class="error-msg" id="enc-error">
        <span>!</span><span id="enc-error-text"></span>
    </div>

    <button class="btn btn-primary" id="enc-btn" onclick="doEncrypt()">
        암호화하기
    </button>

    <div id="enc-result-wrap" style="display:none;">
        <div class="result-box result-animate">
            <div class="result-header">
                <div class="result-label">암호화 완료</div>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-success btn-small" onclick="copyText('enc-output')">복사</button>
                    <button class="btn btn-outline btn-small" onclick="shareText()">공유</button>
                </div>
            </div>
            <div class="result-text" id="enc-output"></div>
        </div>
    </div>
</div>

<!-- 복호화 탭 -->
<div class="tab-content" id="content-decrypt">
    <div class="card">
        <div class="card-title">복호화 키</div>
        <div class="input-group">
            <label class="input-label">암호화 시 사용한 키와 동일해야 합니다</label>
            <input
                type="text"
                id="dec-key"
                class="input-field key-field"
                placeholder="예: 1234"
                inputmode="numeric"
                pattern="[0-9]*"
                oninput="onKeyInput(this, 'dec')"
                maxlength="10"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >
        </div>
    </div>

    <div class="card">
        <div class="card-title">암호문 입력</div>
        <div class="input-group">
            <label class="input-label">복호화할 암호문</label>
            <textarea
                id="dec-input"
                class="input-field"
                placeholder="암호화된 텍스트를 붙여넣으세요..."
                oninput="updateCharCount('dec-input', 'dec-count')"
                style="font-family: 'SF Mono', monospace; font-size:13px;"
            ></textarea>
            <div class="char-count" id="dec-count">0자</div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-outline btn-small" onclick="clearDecrypt()">지우기</button>
            <button class="btn btn-outline btn-small" onclick="pasteFromClipboard('dec-input')">붙여넣기</button>
            <button class="btn btn-outline btn-small" onclick="loadFromEncrypt()">가져오기</button>
        </div>
    </div>

    <div class="error-msg" id="dec-error">
        <span>!</span><span id="dec-error-text"></span>
    </div>

    <button class="btn btn-secondary" id="dec-btn" onclick="doDecrypt()">
        복호화하기
    </button>

    <div id="dec-result-wrap" style="display:none;">
        <div class="result-box decrypt-result result-animate">
            <div class="result-header">
                <div class="result-label decrypt">복호화 완료</div>
                <button class="btn btn-secondary btn-small" onclick="copyText('dec-output')">복사</button>
            </div>
            <div class="result-text plain-text" id="dec-output"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const RESCipher = {
    subTable: {
        'A':'Q','B':'W','C':'E','D':'R','E':'T','F':'Y','G':'U','H':'I',
        'I':'O','J':'P','K':'A','L':'S','M':'D','N':'F','O':'G','P':'H',
        'Q':'J','R':'K','S':'L','T':'Z','U':'X','V':'C','W':'V','X':'B',
        'Y':'N','Z':'M',
        'a':'q','b':'w','c':'e','d':'r','e':'t','f':'y','g':'u','h':'i',
        'i':'o','j':'p','k':'a','l':'s','m':'d','n':'f','o':'g','p':'h',
        'q':'j','r':'k','s':'l','t':'z','u':'x','v':'c','w':'v','x':'b',
        'y':'n','z':'m',
        '0':'5','1':'6','2':'7','3':'8','4':'9',
        '5':'0','6':'1','7':'2','8':'3','9':'4',
    },
    get reverseSubTable() {
        const t = {};
        for (const [k, v] of Object.entries(this.subTable)) t[v] = k;
        return t;
    },
    noiseChars: ['#','@','!','%','^','&','~','|','?','+'],
    generateColumnOrder(columns, key) {
        const order = Array.from({length: columns}, (_, i) => i);
        let seed = key;
        for (let i = columns - 1; i >= 1; i--) {
            seed = ((seed * 1103515245 + 12345) & 0x7fffffff) >>> 0;
            const j = seed % (i + 1);
            [order[i], order[j]] = [order[j], order[i]];
        }
        return order;
    },
    rowTransposition(text, key) {
        const cols = Math.max(2, (key % 8) + 2);
        const chars = [...text];
        const padLen = (cols - (chars.length % cols)) % cols;
        const padded = [...chars, ...Array(padLen).fill('★')];
        const colOrder = this.generateColumnOrder(cols, key);
        const rows = [];
        for (let i = 0; i < padded.length; i += cols) {
            rows.push(padded.slice(i, i + cols));
        }
        let result = '';
        for (const row of rows) {
            for (const ci of colOrder) result += row[ci];
        }
        return result;
    },
    reverseRowTransposition(text, key) {
        const cols = Math.max(2, (key % 8) + 2);
        const chars = [...text];
        const rowCount = Math.ceil(chars.length / cols);
        const colOrder = this.generateColumnOrder(cols, key);
        const reverseOrder = Array(cols);
        colOrder.forEach((orig, newIdx) => { reverseOrder[orig] = newIdx; });
        const grid = [];
        let idx = 0;
        for (let r = 0; r < rowCount; r++) {
            const row = [];
            for (let c = 0; c < cols; c++) {
                row.push(idx < chars.length ? chars[idx++] : '★');
            }
            grid.push(row);
        }
        let result = '';
        for (const row of grid) {
            const restored = Array(cols);
            for (let c = 0; c < cols; c++) restored[reverseOrder[c]] = row[c];
            result += restored.join('');
        }
        return result.replace(/★/g, '');
    },
    expansion(text, key) {
        const keyStr = String(key);
        const chars = [...text];
        let result = '';
        for (let i = 0; i < chars.length; i++) {
            result += chars[i];
            const kd = parseInt(keyStr[i % keyStr.length]) || 1;
            if ((i + 1) % (kd + 1) === 0) {
                const ni = (i * key) % this.noiseChars.length;
                result += this.noiseChars[ni];
            }
        }
        return result;
    },
    removeExpansion(text, key) {
        const keyStr = String(key);
        const chars = [...text];
        let result = '';
        let origIdx = 0;
        let i = 0;
        while (i < chars.length) {
            result += chars[i];
            const kd = parseInt(keyStr[origIdx % keyStr.length]) || 1;
            if ((origIdx + 1) % (kd + 1) === 0) { i++; }
            origIdx++;
            i++;
        }
        return result;
    },
    substitution(text) {
        return [...text].map(c => this.subTable[c] ?? c).join('');
    },
    reverseSubstitution(text) {
        const rev = this.reverseSubTable;
        return [...text].map(c => rev[c] ?? c).join('');
    },
    shiftHangul(text, shift) {
        return [...text].map(c => {
            const code = c.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                return String.fromCharCode(((code - 0xAC00 + shift) % 11172) + 0xAC00);
            }
            return c;
        }).join('');
    },
    reverseShiftHangul(text, shift) {
        return [...text].map(c => {
            const code = c.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                return String.fromCharCode(((code - 0xAC00 - shift + 11172) % 11172) + 0xAC00);
            }
            return c;
        }).join('');
    },
    encrypt(plainText, key) {
        const k = parseInt(key);
        const s1 = this.rowTransposition(plainText, k);
        const s2 = this.expansion(s1, k);
        const s3 = this.substitution(s2);
        const s4 = this.shiftHangul(s3, k % 100 + 1);
        const utf8 = unescape(encodeURIComponent(s4));
        return btoa(utf8);
    },
    decrypt(cipherText, key) {
        try {
            const k = parseInt(key);
            const utf8 = atob(cipherText);
            const s4 = decodeURIComponent(escape(utf8));
            const s3 = this.reverseShiftHangul(s4, k % 100 + 1);
            const s2 = this.reverseSubstitution(s3);
            const s1 = this.removeExpansion(s2, k);
            return this.reverseRowTransposition(s1, k);
        } catch(e) {
            return null;
        }
    }
};

function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('content-' + name).classList.add('active');
}

function onKeyInput(el, prefix) {
    el.value = el.value.replace(/[^0-9]/g, '');
    if (prefix === 'enc') updateKeyStrength(el.value);
}

function updateCharCount(inputId, countId) {
    const len = [...document.getElementById(inputId).value].length;
    document.getElementById(countId).textContent = len.toLocaleString() + '자';
}

function doEncrypt() {
    const text = document.getElementById('enc-input').value.trim();
    const key  = document.getElementById('enc-key').value.trim();
    hideError('enc');
    if (!text) { showError('enc', '암호화할 텍스트를 입력해주세요.'); return; }
    if (!key || !/^\d+$/.test(key) || parseInt(key) <= 0) {
        showError('enc', '올바른 숫자 키를 입력해주세요.'); return;
    }
    const btn = document.getElementById('enc-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> 암호화 중...';
    setTimeout(() => {
        try {
            const result = RESCipher.encrypt(text, key);
            document.getElementById('enc-output').textContent = result;
            const wrap = document.getElementById('enc-result-wrap');
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            showToast('암호화 완료', 'success');
        } catch(e) {
            showError('enc', '오류: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '암호화하기';
        }
    }, 100);
}

function doDecrypt() {
    const cipher = document.getElementById('dec-input').value.trim();
    const key    = document.getElementById('dec-key').value.trim();
    hideError('dec');
    if (!cipher) { showError('dec', '복호화할 암호문을 입력해주세요.'); return; }
    if (!key || !/^\d+$/.test(key) || parseInt(key) <= 0) {
        showError('dec', '올바른 숫자 키를 입력해주세요.'); return;
    }
    const btn = document.getElementById('dec-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> 복호화 중...';
    setTimeout(() => {
        try {
            const result = RESCipher.decrypt(cipher, key);
            if (result === null || result === undefined) {
                showError('dec', '복호화 실패: 키가 틀렸거나 잘못된 암호문입니다.');
            } else {
                document.getElementById('dec-output').textContent = result;
                const wrap = document.getElementById('dec-result-wrap');
                wrap.style.display = 'block';
                wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                showToast('복호화 완료', 'success');
            }
        } catch(e) {
            showError('dec', '복호화 오류: 올바른 형식이 아닙니다.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '복호화하기';
        }
    }, 100);
}

async function copyText(elementId) {
    const text = document.getElementById(elementId).textContent;
    try {
        await navigator.clipboard.writeText(text);
        showToast('클립보드에 복사됨', 'info');
    } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('복사됨', 'info');
    }
}

async function shareText() {
    const text = document.getElementById('enc-output').textContent;
    if (navigator.share) {
        try { await navigator.share({ title: 'RES 암호문', text }); }
        catch(e) {}
    } else {
        copyText('enc-output');
    }
}

async function pasteFromClipboard(inputId) {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById(inputId).value = text;
        const countId = inputId === 'enc-input' ? 'enc-count' : 'dec-count';
        updateCharCount(inputId, countId);
        showToast('붙여넣기 완료', 'info');
    } catch {
        showToast('직접 붙여넣기 해주세요 (길게 탭)', 'error');
    }
}

function loadFromEncrypt() {
    const encrypted = document.getElementById('enc-output').textContent;
    const key = document.getElementById('enc-key').value;
    if (encrypted) {
        document.getElementById('dec-input').value = encrypted;
        document.getElementById('dec-key').value = key;
        updateCharCount('dec-input', 'dec-count');
        showToast('가져오기 완료', 'info');
    } else {
        showToast('먼저 암호화를 실행하세요', 'error');
    }
}

function clearEncrypt() {
    document.getElementById('enc-input').value = '';
    document.getElementById('enc-key').value = '';
    document.getElementById('enc-count').textContent = '0자';
    document.getElementById('enc-result-wrap').style.display = 'none';
    document.getElementById('enc-output').textContent = '';
    hideError('enc');
    resetKeyStrength();
}

function clearDecrypt() {
    document.getElementById('dec-input').value = '';
    document.getElementById('dec-key').value = '';
    document.getElementById('dec-count').textContent = '0자';
    document.getElementById('dec-result-wrap').style.display = 'none';
    document.getElementById('dec-output').textContent = '';
    hideError('dec');
}

function showError(prefix, msg) {
    const el = document.getElementById(prefix + '-error');
    document.getElementById(prefix + '-error-text').textContent = msg;
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function hideError(prefix) {
    document.getElementById(prefix + '-error').classList.remove('show');
}

function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateKeyStrength(value) {
    const len = value.length;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#10b981'];
    const labels = ['매우 약함','약함','보통','강함','매우 강함'];
    let strength = 0;
    if (len >= 1) strength = 1;
    if (len >= 3) strength = 2;
    if (len >= 5) strength = 3;
    if (len >= 7) strength = 4;
    if (len >= 9) strength = 5;
    ['sb1','sb2','sb3','sb4','sb5'].forEach((id, i) => {
        document.getElementById(id).style.background =
            i < strength ? colors[strength - 1] : 'var(--border)';
    });
    const label = document.getElementById('strength-label');
    if (len === 0) {
        label.textContent = '키를 입력하면 강도가 표시됩니다';
        label.style.color = 'var(--text-sub)';
    } else {
        label.textContent = '키 강도: ' + labels[strength - 1];
        label.style.color = colors[strength - 1];
    }
}

function resetKeyStrength() {
    ['sb1','sb2','sb3','sb4','sb5'].forEach(id => {
        document.getElementById(id).style.background = 'var(--border)';
    });
    const label = document.getElementById('strength-label');
    label.textContent = '키를 입력하면 강도가 표시됩니다';
    label.style.color = 'var(--text-sub)';
}

document.getElementById('enc-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doEncrypt();
});
document.getElementById('dec-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doDecrypt();
});

document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('focus', () => {
        setTimeout(() => {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 350);
    });
});
</script>
</body>
</html>
